{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Your Email | Hot Wheels HUB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  
  <style>
    /* Reset & Design Tokens */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-dark: #09090c;
      --bg-card: #18181c;
      --bg-box: #121215;
      --border-subtle: rgba(255, 255, 255, 0.06);
      --border-box: #26262c;
      --border-top-accent: #e51b24;
      --accent-red: #e51b24;
      --accent-red-bright: #ff222e;
      --accent-peach: #fca5a5;
      --text-white: #ffffff;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Navigation */
    .navbar {
      height: 72px;
      background: rgba(9, 9, 12, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      padding: 0 clamp(24px, 5vw, 64px);
      z-index: 100;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-white);
    }

    .logo-badge {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: linear-gradient(135deg, #ff4d00 0%, #e51b24 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 10px rgba(229, 27, 36, 0.3);
    }

    .logo-badge svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
    }

    .brand-name {
      font-family: 'Montserrat', var(--font-main);
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 0.06em;
      color: #ffffff;
    }

    /* Main Viewport with Ambient Radial Glow */
    .otp-viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      position: relative;
      background: 
        radial-gradient(circle at 50% 48%, rgba(229, 27, 36, 0.16) 0%, rgba(229, 27, 36, 0.06) 38%, rgba(9, 9, 12, 0) 70%),
        #09090c;
    }

    /* Figma OTP Card */
    .otp-card {
      width: 100%;
      max-width: 440px;
      background-color: var(--bg-card);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-top: 2px solid var(--border-top-accent);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.75), 0 0 45px rgba(229, 27, 36, 0.12);
      padding: 44px 36px 36px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    /* Circular Envelope Badge */
    .mail-icon-badge {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background-color: #242429;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      color: var(--accent-peach);
    }

    .mail-icon-badge svg {
      width: 24px;
      height: 24px;
      stroke: var(--accent-peach);
      stroke-width: 1.8;
    }

    /* Headings */
    .card-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .card-subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.5;
      max-width: 320px;
      margin-bottom: 28px;
    }

    /* Alert Container */
    .alert-container {
      width: 100%;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .alert-box {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-left: 3px solid var(--accent-red);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 12.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .alert-box.success {
      background: rgba(34, 197, 94, 0.12);
      border-color: rgba(34, 197, 94, 0.35);
      border-left-color: #22c55e;
      color: #86efac;
    }

    .alert-box svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      stroke: currentColor;
    }

    /* Form Styles */
    .otp-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* 6-Digit OTP Boxes Row: 3 boxes - 3 boxes */
    .otp-boxes-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }

    .otp-digit-box {
      width: 46px;
      height: 58px;
      background-color: var(--bg-box);
      border: 1px solid var(--border-box);
      border-radius: 8px;
      color: #ffffff;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      font-family: inherit;
    }

    .otp-digit-box:focus {
      border-color: var(--accent-peach);
      box-shadow: 0 0 0 1px var(--accent-peach);
    }

    .otp-digit-box.filled {
      border-color: #3b3b44;
    }

    .otp-divider {
      color: #4b4c56;
      font-size: 18px;
      font-weight: 600;
      user-select: none;
      padding: 0 2px;
    }

    /* Hidden input that connects to Django backend with exact name="otp" */
    .hidden-real-otp {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      width: 1px;
      height: 1px;
    }

    /* Timer / Resend Row */
    .timer-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
      user-select: none;
    }

    .timer-row svg {
      width: 15px;
      height: 15px;
      stroke: var(--text-muted);
      stroke-width: 2;
    }

    .timer-digits {
      color: var(--accent-peach);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .resend-link {
      display: none;
      color: var(--accent-peach);
      text-decoration: underline;
      font-weight: 700;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .resend-link:hover {
      color: #ffffff;
    }

    /* Verify & Proceed Button */
    .btn-verify {
      width: 100%;
      height: 48px;
      background-color: var(--accent-red);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 18px rgba(229, 27, 36, 0.45);
      transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }

    .btn-verify:hover {
      background-color: var(--accent-red-bright);
      box-shadow: 0 6px 24px rgba(229, 27, 36, 0.65);
      transform: translateY(-1px);
    }

    .btn-verify:active {
      transform: translateY(0);
    }

    /* Cancel Link */
    .cancel-link {
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .cancel-link:hover {
      color: #ffffff;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .otp-card {
        padding: 34px 20px 28px 20px;
      }
      .otp-digit-box {
        width: 40px;
        height: 52px;
        font-size: 20px;
      }
      .otp-boxes-container {
        gap: 6px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header class="navbar">
    <a href="{% url 'home' %}" class="brand-logo">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24">
          <path d="M12 2c1.1 0 2.2.4 3 1.1 2.3 2 2.8 5.6 1.1 8.2l-1.3 2c-.3.4-.2 1 .2 1.3.4.3 1 .2 1.3-.2l1.6-2.5c1.6-2.6 1.4-6-.4-8.4-1.2-1.6-3-2.6-5-2.7-1.1-.1-2.2.2-3.1.8-2.6 1.7-3.7 4.9-2.7 7.8l.6 1.7c.2.5.7.8 1.2.7.5-.1.9-.6.7-1.1l-.6-1.7c-.6-1.9.1-4 1.8-5.1.7-.5 1.4-.7 2.1-.6z"/>
          <path d="M11 9c.6 0 1 .4 1 1v6c0 1.7-1.3 3-3 3s-3-1.3-3-3v-4c0-.6.4-1 1-1s1 .4 1 1v4c0 .6.4 1 1 1s1-.4 1-1v-6c0-.6.4-1 1-1z"/>
          <path d="M17.5 13.5c-.5.3-.7.9-.4 1.4.7 1.3.9 2.7.4 4.1-.7 1.9-2.4 3.2-4.5 3.5-2.5.4-4.9-.9-5.9-3.2-.2-.5-.8-.8-1.3-.6-.5.2-.8.8-.6 1.3 1.4 3.1 4.5 4.8 7.9 4.3 2.9-.4 5.3-2.2 6.2-4.9.7-1.9.4-3.9-.6-5.6-.2-.5-.8-.7-1.2-.3z"/>
        </svg>
      </div>
      <span class="brand-name">HUB</span>
    </a>
  </header>

  <!-- OTP Viewport -->
  <main class="otp-viewport">
    <div class="otp-card">

      <!-- Circular Envelope Badge -->
      <div class="mail-icon-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
        </svg>
      </div>

      <!-- Title & Subtitle -->
      <h1 class="card-title">Verify Your Email</h1>
      <p class="card-subtitle">We've sent a 6-digit verification code to your registered email</p>

      <!-- Django Messages -->
      {% if messages %}
        <div class="alert-container">
          {% for message in messages %}
            <div class="alert-box {% if message.tags == 'success' %}success{% endif %}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
              <span>{{ message }}</span>
            </div>
          {% endfor %}
        </div>
      {% endif %}

      <!-- OTP Form connected to Django POST action -->
      <form method="POST" action="{% url 'verify_otp' %}" class="otp-form" id="otpForm">
        {% csrf_token %}

        <!-- Hidden input that retains exact backend name="otp" -->
        <input 
          type="text" 
          id="realOtpInput" 
          name="otp" 
          class="hidden-real-otp" 
          maxlength="6" 
          required
        >

        <!-- 6 Visual Digits: 3 boxes - 3 boxes -->
        <div class="otp-boxes-container">
          <input type="text" class="otp-digit-box" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autofocus>
          <input type="text" class="otp-digit-box" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
          <input type="text" class="otp-digit-box" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
          <span class="otp-divider">-</span>
          <input type="text" class="otp-digit-box" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
          <input type="text" class="otp-digit-box" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
          <input type="text" class="otp-digit-box" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
        </div>

        <!-- Timer / Resend Row -->
        <div class="timer-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <span id="timerTextContainer">Resend code in <span class="timer-digits" id="timer">00:58</span></span>
          <a href="{% url 'resend_otp' %}" class="resend-link" id="resendLink">Resend Code</a>
        </div>

        <!-- Verify & Proceed Button -->
        <button type="submit" class="btn-verify">
          VERIFY &amp; PROCEED
        </button>

        <!-- Cancel Link -->
        <a href="{% url 'signup' %}" class="cancel-link">
          &larr; Cancel
        </a>
      </form>

    </div>
  </main>

  <!-- Interactive JavaScript: OTP Box Sync, Timer & Stale Back Prevention -->
  <script>
    // Handle Browser Back Navigation & BFCache Restoration after successful OTP verification
    (function handleStaleOtpNavigation() {
      function checkStaleOtp(event) {
        const isBfcache = Boolean(event && event.persisted);
        const navEntries = window.performance && performance.getEntriesByType && performance.getEntriesByType('navigation');
        const isBackForward = navEntries && navEntries.length > 0 
          ? (navEntries[0].type === 'back_forward') 
          : Boolean(window.performance && window.performance.navigation && window.performance.navigation.type === 2);
        
        const isBackNav = isBfcache || isBackForward;
        const wasVerified = sessionStorage.getItem('otp_verified') === 'true';

        // If user navigated back into this page after successfully verifying OTP
        if (isBackNav && wasVerified) {
          window.location.replace("{% url 'login' %}");
          return;
        }

        // If this is a fresh navigation or an error message exists, clear any stale verified flag
        if (!isBackNav) {
          const hasError = document.querySelector('.alert-box:not(.success)');
          if (hasError) {
            sessionStorage.removeItem('otp_verified');
          }
        }
      }

      // Check on initial load/restore
      checkStaleOtp();
      // Listen for BFCache restoration (Back button in Chrome/Safari)
      window.addEventListener('pageshow', checkStaleOtp);
    })();

    document.addEventListener('DOMContentLoaded', function() {
      const boxes = Array.from(document.querySelectorAll('.otp-digit-box'));
      const realInput = document.getElementById('realOtpInput');
      const form = document.getElementById('otpForm');
      const cancelLink = document.querySelector('.cancel-link');

      if (cancelLink) {
        cancelLink.addEventListener('click', function() {
          sessionStorage.removeItem('otp_verified');
        });
      }

      function syncRealInput() {
        realInput.value = boxes.map(b => b.value).join('');
      }

      boxes.forEach((box, idx) => {
        // Numeric input handling and auto-advance
        box.addEventListener('input', function(e) {
          const val = this.value.replace(/[^0-9]/g, '');
          this.value = val ? val[val.length - 1] : '';

          if (this.value) {
            this.classList.add('filled');
            if (idx < boxes.length - 1) {
              boxes[idx + 1].focus();
            }
          } else {
            this.classList.remove('filled');
          }
          syncRealInput();
        });

        // Backspace and Arrow Key Navigation
        box.addEventListener('keydown', function(e) {
          if (e.key === 'Backspace') {
            if (!this.value && idx > 0) {
              boxes[idx - 1].focus();
              boxes[idx - 1].value = '';
              boxes[idx - 1].classList.remove('filled');
              syncRealInput();
            } else {
              this.classList.remove('filled');
            }
          } else if (e.key === 'ArrowLeft' && idx > 0) {
            boxes[idx - 1].focus();
          } else if (e.key === 'ArrowRight' && idx < boxes.length - 1) {
            boxes[idx + 1].focus();
          }
        });

        // 6-digit paste handling
        box.addEventListener('paste', function(e) {
          e.preventDefault();
          const pasteData = (e.clipboardData || window.clipboardData).getData('text');
          const cleanDigits = pasteData.replace(/[^0-9]/g, '').slice(0, 6);
          if (cleanDigits) {
            cleanDigits.split('').forEach((d, i) => {
              if (boxes[i]) {
                boxes[i].value = d;
                boxes[i].classList.add('filled');
              }
            });
            syncRealInput();
            const targetIndex = Math.min(cleanDigits.length, boxes.length - 1);
            boxes[targetIndex].focus();
          }
        });
      });

      // Form validation before submit
      form.addEventListener('submit', function(e) {
        syncRealInput();
        if (realInput.value.length !== 6) {
          e.preventDefault();
          const firstEmpty = boxes.find(b => !b.value);
          if (firstEmpty) firstEmpty.focus();
        } else {
          // Set verification flag upon successful form submission
          sessionStorage.setItem('otp_verified', 'true');
        }
      });

      // Countdown Timer Logic
      let totalSeconds = {{ remaining_seconds|default:58 }};
      const timerDisplay = document.getElementById("timer");
      const timerContainer = document.getElementById("timerTextContainer");
      const resendLink = document.getElementById("resendLink");

      function formatTime(sec) {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      }

      function updateTimer() {
        if (totalSeconds <= 0) {
          if (timerContainer) timerContainer.style.display = "none";
          if (resendLink) resendLink.style.display = "inline";
          clearInterval(countdownInterval);
          return;
        }

        if (timerDisplay) {
          timerDisplay.textContent = formatTime(totalSeconds);
        }
        totalSeconds--;
      }

      updateTimer();
      const countdownInterval = setInterval(updateTimer, 1000);
    });
  </script>
</body>
</html>
