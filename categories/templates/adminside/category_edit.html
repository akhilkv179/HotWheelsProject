{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Category | Hot Wheels Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-dark: #0b0b0e;
      --bg-sidebar: #070709;
      --bg-card: #121217;
      --bg-input: #15151c;
      --border-subtle: rgba(255, 255, 255, 0.05);
      --border-card: rgba(255, 255, 255, 0.07);
      --border-input: rgba(255, 255, 255, 0.09);
      --border-top-accent: #e51b24;
      --accent-red: #e51b24;
      --accent-red-hover: #ff222e;
      --accent-orange: #ff4d00;
      --accent-coral: #f87171;
      --text-white: #ffffff;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --text-header: #c5c7d0;
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-heading: 'Montserrat', var(--font-main);
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .admin-layout {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }

    .admin-sidebar {
      width: 250px;
      min-width: 250px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 32px 20px 24px 20px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      z-index: 50;
      transition: transform 0.25s ease;
    }

    .sidebar-top {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .brand-header {
      padding: 0 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-family: var(--font-heading);
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: #ffffff;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 18px;
      background: linear-gradient(180deg, var(--accent-orange), var(--accent-red));
      border-radius: 2px;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .nav-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-group-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #555765;
      text-transform: uppercase;
      padding: 0 10px;
      margin-bottom: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 12px;
      border-radius: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    .nav-item svg {
      width: 17px;
      height: 17px;
      stroke-width: 2;
      flex-shrink: 0;
      stroke: var(--text-dim);
      transition: stroke 0.15s ease;
    }

    .nav-item:hover {
      color: #ffffff;
      background-color: rgba(255, 255, 255, 0.03);
    }

    .nav-item.active {
      color: #ffffff;
      background-color: #16161d;
      border: 1px solid rgba(255, 255, 255, 0.06);
      font-weight: 700;
    }

    .nav-item.active svg {
      stroke: var(--accent-red);
    }

    .sidebar-bottom {
      border-top: 1px solid var(--border-subtle);
      padding-top: 16px;
      margin-top: 20px;
    }

    .logout-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      color: #8c8d98;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    .logout-item:hover {
      color: #f87171;
      background-color: rgba(239, 68, 68, 0.08);
    }

    .logout-item svg {
      width: 17px;
      height: 17px;
    }

    .admin-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background-color: var(--bg-dark);
      background-image: radial-gradient(ellipse 70% 40% at 50% 0%, rgba(229, 27, 36, 0.04), transparent 70%);
    }

    .admin-topbar {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 44px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .topbar-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .topbar-badge .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent-red);
      box-shadow: 0 0 8px rgba(229, 27, 36, 0.8);
    }

    .content-viewport {
      padding: 40px 44px 60px 44px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }

    .page-title {
      font-family: var(--font-heading);
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .page-subtitle {
      font-size: 14px;
      color: var(--text-muted);
    }

    .dashboard-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-card);
      border-top: 2px solid var(--border-top-accent);
      border-radius: 16px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.4);
      padding: 32px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 22px;
    }

    .form-label {
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--text-header);
      text-transform: uppercase;
    }

    .form-input,
    .form-textarea {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border-input);
      border-radius: 8px;
      padding: 12px 14px;
      color: #ffffff;
      font-family: inherit;
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-input:focus,
    .form-textarea:focus {
      border-color: rgba(229, 27, 36, 0.6);
      box-shadow: 0 0 0 3px rgba(229, 27, 36, 0.15);
    }

    .form-textarea {
      min-height: 100px;
      resize: vertical;
    }

    .form-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 10px;
    }

    .btn-cancel {
      height: 44px;
      padding: 0 20px;
      background-color: #1b1c24;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-submit {
      height: 44px;
      padding: 0 24px;
      background-color: var(--accent-red);
      color: #ffffff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(229, 27, 36, 0.4);
    }

    .btn-submit:hover {
      background-color: var(--accent-red-hover);
    }

    @media (max-width: 1024px) {
      .admin-sidebar {
        display: none;
      }
      .content-viewport {
        padding: 24px;
      }
    }
  </style>
</head>
<body>

  <div class="admin-layout">

    <aside class="admin-sidebar">
      <div class="sidebar-top">
        <div class="brand-header">
          <span class="brand-title">ADMIN</span>
        </div>
        <nav class="sidebar-nav">
          <div class="nav-group">
            <span class="nav-group-label">OVERVIEW</span>
            <a href="{% url 'admin_dashboard' %}" class="nav-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"/>
                <rect x="14" y="3" width="7" height="7"/>
                <rect x="14" y="14" width="7" height="7"/>
                <rect x="3" y="14" width="7" height="7"/>
              </svg>
              <span>Dashboard</span>
            </a>
          </div>

          <div class="nav-group">
            <span class="nav-group-label">CATALOG</span>
            <a href="{% url 'admin_product_list' %}" class="nav-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                <line x1="12" y1="22.08" x2="12" y2="12"/>
              </svg>
              <span>Products</span>
            </a>
            <a href="{% url 'admin_category_list' %}" class="nav-item active">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M3 9h18v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9z"/>
                <path d="m3 9 2.45-4.9A2 2 0 0 1 7.24 3h9.52a2 2 0 0 1 1.79 1.1L21 9"/>
              </svg>
              <span>Categories</span>
            </a>
          </div>

          <div class="nav-group">
            <span class="nav-group-label">CUSTOMERS</span>
            <a href="{% url 'user_list' %}" class="nav-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
              <span>Users</span>
            </a>
          </div>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <a href="{% url 'admin_logout' %}" class="logout-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          <span>Logout</span>
        </a>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <div class="topbar-left">
          <div class="topbar-badge">
            <span class="badge-dot"></span>
            <span>HOT WHEELS HUB &bull; ADMINISTRATOR CONSOLE</span>
          </div>
        </div>
      </header>

      <div class="content-viewport">
        <div>
          <h1 class="page-title">EDIT CATEGORY</h1>
          <p class="page-subtitle">Update information for category "{{ category.name }}".</p>
        </div>

        <div class="dashboard-card">
          <form method="POST">
            {% csrf_token %}
            <div class="form-group">
              <label class="form-label" for="categoryName">Category Name</label>
              <input type="text" id="categoryName" name="name" class="form-input" value="{{ category.name }}" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="categoryDescription">Description</label>
              <textarea id="categoryDescription" name="description" class="form-textarea" required>{{ category.description }}</textarea>
            </div>

            <div class="form-actions">
              <a href="{% url 'admin_category_list' %}" class="btn-cancel">Cancel</a>
              <button type="submit" class="btn-submit">Update Category</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
