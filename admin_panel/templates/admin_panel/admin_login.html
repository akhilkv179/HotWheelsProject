<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Hot Wheels</title>
</head>

<body>
    {% if messages %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
     {% endif %}

    <main>
        <div class="login-container">

            <div class="logo">
                Hot Wheels Hub
            </div>

            <h1>Admin Login</h1>

            <p>Sign in to manage your Hot Wheels store.</p>

            <form method="POST">

                {% csrf_token %}

                <label for="identifier">
                    Email or Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your email or username"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">
                    Login to Admin Panel
                </button>

            </form>

        </div>
    </main>

</body>
</html>
