{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email OTP | Admin Portal | Hot Wheels HUB</title>

  <!-- Google Fonts: Montserrat for bold headers, Inter for clean inputs & UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    /* CSS Reset & Design Tokens matching Figma Image 1 Panel 3 & Image 2 */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-dark: #0b0b0e;
      --bg-card: #1c1b1b;
      --bg-input: #12131a;
      --border-card: rgba(255, 255, 255, 0.08);
      --border-coral-card: rgba(245, 165, 150, 0.45);
      --border-coral-glow: rgba(245, 165, 150, 0.12);
      --border-input: rgba(255, 255, 255, 0.12);

      --accent-coral: #f5a596;
      --accent-peach-btn: #ffb3ac;
      --accent-peach-hover: #fca5a5;
      --accent-red: #e31837;

      --text-white: #ffffff;
      --text-muted: #8e8f9c;
      --text-dim: #6b7280;
      --text-dark: #0b0b0e;
      --text-footer: #454652;

      --font-heading: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle 550px at 50% 25%, rgba(229, 27, 36, 0.04), transparent 75%);
      color: var(--text-white);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 32px 24px 20px 24px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    /* Top Left Brand Corner Badge */
    .top-brand-corner {
      position: absolute;
      top: 24px;
      left: 24px;
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .brand-circle-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff4d00, #e51b24 85%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 10px rgba(229, 27, 36, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .brand-circle-badge svg {
      width: 17px;
      height: 17px;
      fill: #ffffff;
    }

    /* Main Center Wrapper matching Figma Panel 3 */
    .otp-wrapper {
      width: 100%;
      max-width: 440px;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px 16px;
    }

    /* Envelope Badge matching Figma Panel 3 */
    .envelope-badge {
      width: 48px;
      height: 48px;
      background-color: #171822;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
    }

    .envelope-badge svg {
      width: 20px;
      height: 20px;
      color: #f87171;
    }

    /* Title & Description */
    .otp-title {
      font-family: var(--font-heading);
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .otp-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      max-width: 330px;
      margin-bottom: 28px;
    }

    /* Error Alert Banner */
    .alert-banner {
      width: 100%;
      max-width: 360px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 12.5px;
      margin-bottom: 20px;
      text-align: center;
      display: none;
    }

    .alert-banner.show {
      display: block;
    }

    /* Form Container */
    .otp-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* 6-Digit OTP Box Grid */
    .otp-inputs-grid {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 360px;
    }

    .otp-box {
      width: 46px;
      height: 52px;
      background-color: var(--bg-input);
      border: 1px solid var(--border-input);
      border-radius: 8px;
      font-family: inherit;
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .otp-box::-webkit-outer-spin-button,
    .otp-box::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .otp-box:focus {
      border-color: var(--accent-coral);
      background-color: #1a1b24;
      box-shadow: 0 0 0 2px rgba(245, 165, 150, 0.22);
    }

    .otp-box.filled {
      border-color: rgba(255, 255, 255, 0.22);
      background-color: #171821;
    }

    .otp-box.error-state {
      border-color: rgba(239, 68, 68, 0.6);
      background-color: rgba(239, 68, 68, 0.08);
    }

    /* Verify Button in Peach/Salmon matching Figma Panel 3 */
    .btn-verify {
      width: 100%;
      max-width: 360px;
      height: 48px;
      background-color: var(--accent-peach-btn);
      color: var(--text-dark);
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(248, 113, 113, 0.25);
      transition: background-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
    }

    .btn-verify:hover {
      background-color: var(--accent-peach-hover);
      box-shadow: 0 6px 20px rgba(248, 113, 113, 0.38);
      transform: translateY(-1px);
    }

    .btn-verify:active {
      transform: translateY(0);
    }

    .btn-verify:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-verify svg {
      width: 14px;
      height: 14px;
      transition: transform 0.15s ease;
    }

    .btn-verify:hover svg {
      transform: translateX(2px);
    }

    /* Resend Section */
    .resend-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .btn-resend-inline {
      background: transparent;
      border: none;
      color: var(--accent-coral);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
      transition: color 0.15s ease;
    }

    .btn-resend-inline:hover {
      color: #ffffff;
    }

    .btn-resend-inline:disabled {
      color: var(--text-dim);
      cursor: not-allowed;
      text-decoration: none;
    }

    /* Back Link */
    .btn-back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      margin-top: 20px;
      transition: color 0.15s ease;
    }

    .btn-back-link:hover {
      color: #ffffff;
    }

    /* ==========================================================================
       SUCCESS MODAL MATCHING FIGMA IMAGE 2
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 20px;
    }

    .modal-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: #171821;
      border: 1px solid var(--border-coral-card);
      box-shadow: 
        0 24px 60px rgba(0, 0, 0, 0.9),
        0 0 30px var(--border-coral-glow);
      border-radius: 14px;
      width: 100%;
      max-width: 320px;
      padding: 34px 26px 28px 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transform: scale(0.94);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-backdrop.show .modal-card {
      transform: scale(1);
    }

    .modal-check-badge {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: #ffffff;
      color: #0b0b0e;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(255, 255, 255, 0.2);
    }

    .modal-check-badge svg {
      width: 18px;
      height: 18px;
    }

    .modal-title {
      font-size: 13.5px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #ffffff;
      margin-top: 18px;
    }

    .modal-subtitle {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.45;
    }

    .btn-modal-done {
      width: 100%;
      height: 40px;
      background-color: var(--accent-peach-btn);
      color: var(--text-dark);
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 22px;
      box-shadow: 0 4px 14px rgba(248, 113, 113, 0.25);
      transition: background-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
    }

    .btn-modal-done:hover {
      background-color: var(--accent-peach-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(248, 113, 113, 0.38);
    }

    .btn-modal-done:active {
      transform: translateY(0);
    }

    /* Toast Notification Container */
    .toast-container {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast-msg {
      background: #171822;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 12px 18px;
      color: #ffffff;
      font-size: 12.5px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: auto;
    }

    .toast-msg.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast-msg.error {
      border-color: rgba(239, 68, 68, 0.35);
      background: #1e1315;
      color: #f87171;
    }

    /* Footer Note */
    .page-footer {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--text-footer);
      text-transform: uppercase;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      padding-bottom: 8px;
    }

    @media (max-width: 480px) {
      .otp-title {
        font-size: 23px;
      }
      .otp-inputs-grid {
        gap: 6px;
      }
      .otp-box {
        width: 38px;
        height: 46px;
        font-size: 19px;
      }
      .top-brand-corner {
        top: 16px;
        left: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Left Brand Corner Badge -->
  <a href="{% url 'admin_profile' %}" class="top-brand-corner" title="Back to Admin Dashboard">
    <div class="brand-circle-badge">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C8 6 6 9 6 13a6 6 0 0 0 12 0c0-4-2-7-6-11zm0 15a4 4 0 0 1-4-4c0-2.5 1.5-4.5 4-7 2.5 2.5 4 4.5 4 7a4 4 0 0 1-4 4z"/>
      </svg>
    </div>
  </a>

  <!-- Centered OTP Verification Wrapper -->
  <main class="otp-wrapper">

    <!-- Envelope Icon Badge matching Figma Panel 3 -->
    <div class="envelope-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
      </svg>
    </div>

    <!-- Title & Instructions matching Figma Panel 3 -->
    <h1 class="otp-title">New Email OTP</h1>
    <p class="otp-subtitle">Enter the code sent to your email</p>

    <!-- Error Banner -->
    <div class="alert-banner" id="errorBanner"></div>

    <!-- Verification Form -->
    <form id="verifyEmailOtpForm" method="POST" action="{% url 'admin_verify_email_change_otp' %}" class="otp-form">
      {% csrf_token %}

      <!-- Hidden Combined OTP Field -->
      <input type="hidden" name="otp" id="hiddenOtpInput">

      <!-- 6 Box OTP Input Grid -->
      <div class="otp-inputs-grid" id="otpGrid">
        <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autofocus>
        <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
        <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
        <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
        <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
        <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
      </div>

      <!-- Verify Button in Peach/Salmon matching Figma Panel 3 -->
      <button type="submit" class="btn-verify" id="btnVerifyOtp">
        <span>Verify OTP</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      </button>

      <!-- Resend & Timer Section -->
      <div class="resend-row">
        <span>Didn't receive code?</span>
        <button type="button" class="btn-resend-inline" id="btnResendOtp" disabled>
          Resend OTP in <span id="cooldownTimer">30</span>s
        </button>
      </div>

    </form>

    <!-- Back to Profile Link -->
    <a href="{% url 'admin_profile' %}" class="btn-back-link">
      &lt; Back to Profile
    </a>

  </main>

  <!-- ==========================================================================
       SUCCESS MODAL MATCHING FIGMA IMAGE 2
       ========================================================================== -->
  <div class="modal-backdrop" id="successModalBackdrop" aria-modal="true" role="dialog">
    <div class="modal-card">
      <div class="modal-check-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <h3 class="modal-title">EMAIL UPDATED</h3>
      <p class="modal-subtitle">Your email address has been successfully updated.</p>
      <button type="button" class="btn-modal-done" id="btnModalDone">DONE</button>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Bottom Copyright Footer -->
  <footer class="page-footer">
    &copy; 2026 HOT WHEELS INC. ALL RIGHTS RESERVED.
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const otpBoxes = Array.from(document.querySelectorAll('.otp-box'));
      const hiddenInput = document.getElementById('hiddenOtpInput');
      const form = document.getElementById('verifyEmailOtpForm');
      const btnVerify = document.getElementById('btnVerifyOtp');
      const btnResend = document.getElementById('btnResendOtp');
      const errorBanner = document.getElementById('errorBanner');
      const toastContainer = document.getElementById('toastContainer');
      const modalBackdrop = document.getElementById('successModalBackdrop');
      const btnModalDone = document.getElementById('btnModalDone');

      let cooldown = 30;
      let timerInterval = null;
      let redirectTargetUrl = "{% url 'admin_profile' %}";

      function showToast(message, type = 'error') {
        if (!toastContainer) return;
        const toast = document.createElement('div');
        toast.className = `toast-msg ${type}`;
        toast.textContent = message;
        toastContainer.appendChild(toast);

        requestAnimationFrame(() => toast.classList.add('show'));

        setTimeout(() => {
          toast.classList.remove('show');
          setTimeout(() => {
            if (toast.parentNode) toast.parentNode.removeChild(toast);
          }, 300);
        }, 4000);
      }

      function showError(message) {
        if (errorBanner) {
          errorBanner.textContent = message;
          errorBanner.classList.add('show');
        }
        otpBoxes.forEach(b => b.classList.add('error-state'));
      }

      function clearError() {
        if (errorBanner) {
          errorBanner.classList.remove('show');
          errorBanner.textContent = '';
        }
        otpBoxes.forEach(b => b.classList.remove('error-state'));
      }

      function updateHiddenInput() {
        const val = otpBoxes.map(b => b.value).join('');
        if (hiddenInput) hiddenInput.value = val;
        return val;
      }

      // Handle 6-Box Navigation
      otpBoxes.forEach((box, index) => {
        box.addEventListener('input', function () {
          clearError();
          const val = this.value.replace(/\D/g, '');
          this.value = val ? val[0] : '';

          if (this.value) {
            this.classList.add('filled');
            if (index < otpBoxes.length - 1) {
              otpBoxes[index + 1].focus();
            }
          } else {
            this.classList.remove('filled');
          }

          updateHiddenInput();
        });

        box.addEventListener('keydown', function (e) {
          if (e.key === 'Backspace') {
            clearError();
            if (!this.value && index > 0) {
              otpBoxes[index - 1].focus();
              otpBoxes[index - 1].value = '';
              otpBoxes[index - 1].classList.remove('filled');
              updateHiddenInput();
            } else {
              this.value = '';
              this.classList.remove('filled');
              updateHiddenInput();
            }
          } else if (e.key === 'ArrowLeft' && index > 0) {
            otpBoxes[index - 1].focus();
          } else if (e.key === 'ArrowRight' && index < otpBoxes.length - 1) {
            otpBoxes[index + 1].focus();
          }
        });

        box.addEventListener('paste', function (e) {
          e.preventDefault();
          clearError();
          const text = (e.clipboardData || window.clipboardData).getData('text').trim();
          const digits = text.replace(/\D/g, '').slice(0, 6);

          if (digits) {
            digits.split('').forEach((digit, i) => {
              if (i < otpBoxes.length) {
                otpBoxes[i].value = digit;
                otpBoxes[i].classList.add('filled');
              }
            });

            const nextIndex = Math.min(digits.length, otpBoxes.length - 1);
            otpBoxes[nextIndex].focus();
            updateHiddenInput();
          }
        });
      });

      // Submit Form
      if (form) {
        form.addEventListener('submit', async function (e) {
          e.preventDefault();
          clearError();

          const otp = updateHiddenInput();
          if (otp.length < 6) {
            showError('Please enter all 6 digits of the OTP.');
            return;
          }

          if (btnVerify) {
            btnVerify.disabled = true;
            btnVerify.innerHTML = '<span>Verifying...</span>';
          }

          try {
            const formData = new FormData(form);
            const response = await fetch(form.action || "{% url 'admin_verify_email_change_otp' %}", {
              method: 'POST',
              body: formData,
              headers: {
                'Accept': 'application/json',
                'X-Requested-With': 'XMLHttpRequest'
              }
            });

            const data = await response.json().catch(() => ({}));

            if (response.ok && data.success) {
              if (data.redirect_url) {
                redirectTargetUrl = data.redirect_url;
              }
              // Display Success Modal matching Figma Image 2
              if (modalBackdrop) {
                modalBackdrop.classList.add('show');
              } else {
                window.location.href = redirectTargetUrl;
              }
            } else {
              showError(data.message || 'Invalid or expired OTP. Please try again.');
              showToast(data.message || 'Verification failed.', 'error');
              if (btnVerify) {
                btnVerify.disabled = false;
                btnVerify.innerHTML = '<span>Verify OTP</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
              }
            }
          } catch (networkErr) {
            showError('Network error while verifying OTP. Please try again.');
            showToast('Unable to reach server.', 'error');
            if (btnVerify) {
              btnVerify.disabled = false;
              btnVerify.innerHTML = '<span>Verify OTP</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
            }
          }
        });
      }

      // Resend OTP Cooldown Timer Management
      function startTimer(seconds) {
        cooldown = seconds;
        if (timerInterval) clearInterval(timerInterval);

        if (btnResend) {
          btnResend.disabled = true;
          btnResend.innerHTML = `Resend OTP in <span id="cooldownTimer">${cooldown}</span>s`;
        }

        timerInterval = setInterval(() => {
          cooldown--;
          const span = document.getElementById('cooldownTimer');
          if (span) span.textContent = cooldown;

          if (cooldown <= 0) {
            clearInterval(timerInterval);
            timerInterval = null;
            if (btnResend) {
              btnResend.disabled = false;
              btnResend.textContent = 'Resend OTP';
            }
          }
        }, 1000);
      }

      startTimer(30);

      // Resend OTP Click Handler
      if (btnResend) {
        btnResend.addEventListener('click', async function () {
          if (cooldown > 0) return;

          btnResend.disabled = true;
          btnResend.textContent = 'Sending...';

          try {
            const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || '';
            const formData = new FormData();
            formData.append('csrfmiddlewaretoken', csrfToken);

            const response = await fetch("{% url 'admin_resend_email_change_otp' %}", {
              method: 'POST',
              body: formData,
              headers: {
                'Accept': 'application/json',
                'X-Requested-With': 'XMLHttpRequest'
              }
            });

            const data = await response.json().catch(() => ({}));

            if (response.status === 429) {
              const retryAfter = data.retry_after || 30;
              showToast(data.message || 'Please wait before requesting another OTP.', 'error');
              startTimer(retryAfter);
              return;
            }

            if (response.ok && data.success) {
              // Clear inputs
              otpBoxes.forEach(b => {
                b.value = '';
                b.classList.remove('filled', 'error-state');
              });
              if (hiddenInput) hiddenInput.value = '';
              otpBoxes[0].focus();
              startTimer(30);
            } else {
              showToast(data.message || 'Could not resend OTP.', 'error');
              btnResend.disabled = false;
              btnResend.textContent = 'Resend OTP';
            }
          } catch (err) {
            showToast('Network error while resending OTP.', 'error');
            btnResend.disabled = false;
            btnResend.textContent = 'Resend OTP';
          }
        });
      }

      // Modal Done Button
      if (btnModalDone) {
        btnModalDone.addEventListener('click', function () {
          window.location.href = redirectTargetUrl;
        });
      }
    });
  </script>
</body>
</html>
